name: Build Electron for Apple Silicon
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            renderer/package-lock.json
            electron/package-lock.json
      - run: npm ci
        working-directory: renderer
      - run: npm test
        working-directory: renderer
      - run: npm ci
        working-directory: electron
      - run: npm test
        working-directory: electron
        env:
          YUI_SMOKE_SCREENSHOTS: ${{ runner.temp }}
      - run: npm run package:mac
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node tests/electron-smoke.cjs --packaged
        env:
          YUI_SMOKE_SCREENSHOTS: ${{ runner.temp }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: YuiTracking-Mac-screenshots
          path: ${{ runner.temp }}/yuitracking-mac-*.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: YuiTracking-Mac-arm64
          path: |
            dist/electron/*.dmg
            dist/electron/*.zip
          if-no-files-found: error
