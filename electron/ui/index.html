<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>YuiTracking</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; frame-src 'self'; connect-src 'self';">
<link rel="stylesheet" href="style.css"></head><body>
<header><h1>YuiTracking</h1><p>顔と手で、アバターに命を。</p></header>
<main><section><p>PROGRAM / 配信プレビュー　1280 × 720・最大60fps</p><iframe id="preview" src="/renderer/index.html" allow="camera"></iframe><p id="status">描画エンジンの準備中…</p><label><input id="privacy" type="checkbox"> 緊急待機画面</label><p class="note">映像は端末内で認識します。実写カメラ映像は表示しません。</p></section>
<aside><h2>01 アバター</h2><button id="open">VRMファイルを開く</button><p id="model"></p><button id="demo">サンプルに戻す</button>
<h2>02 トラッキング</h2><select id="cameras"><option value="">既定のカメラ</option></select><button id="tracking">カメラを開始</button><p id="input"></p><button id="calibrate">正面をキャリブレーション</button>
<label>滑らかさ <output id="smoothing-value"></output><input id="smoothing" type="range" min="0" max="0.95" step="0.01" value="0.65"></label>
<label>顔の動きの強さ <output id="sensitivity-value"></output><input id="sensitivity" type="range" min="0.3" max="2" step="0.05" value="1"></label>
<label>口の開き具合 <output id="mouthOpenStrength-value"></output><input id="mouthOpenStrength" type="range" min="0.5" max="3" step="0.05" value="1"></label>
<label>口の感度 <output id="mouthSensitivity-value"></output><input id="mouthSensitivity" type="range" min="0.5" max="3" step="0.05" value="1.8"></label>
<label>揺れものの強さ <output id="springStrength-value"></output><input id="springStrength" type="range" min="0.3" max="3" step="0.05" value="1"></label>
<h2>03 背景</h2><select id="background"><option value="#00ff00">クロマキー・グリーン</option><option value="#0000ff">クロマキー・ブルー</option><option value="#171b2e">ダーク</option></select>
<p class="note">Ctrl＋ホイールで拡大縮小。ホイールドラッグで位置を調整。前回のモデル・位置・調整値を復元します。</p>
<h2>04 配信出力</h2><button id="syphon" disabled>Syphon出力を開始</button><p id="output-status">Syphon：停止中</p><p class="note">OBS → Syphonクライアント → YuiTracking。アバターと背景だけを送信します。映像キャプチャデバイスへの出力ではありません。</p></aside></main>
<script src="app.js"></script></body></html>
