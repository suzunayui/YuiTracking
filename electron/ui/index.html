<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>YuiTracking</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; frame-src 'self'; connect-src 'self';">
<link rel="stylesheet" href="style.css"></head><body>
<main id="main">
 <section class="preview-panel">
  <iframe id="preview" src="/renderer/index.html" allow="camera" title="アバターのプレビュー"></iframe>
  <p id="standby-notice" hidden>待機中：アバターを隠して透過で出力しています</p>
  <div class="preview-status">
   <div class="camera-section"><button id="syphon" class="wide output-button" disabled title="透過背景のアバター映像をSyphonへ送信します。&#10;OBS → Syphonクライアント → YuiTracking を選びます。">Syphon出力を開始</button><div class="camera-row"><select id="cameras" title="トラッキングに使うカメラを選びます。"></select><button id="refresh-cameras" title="Macとブラウザーのカメラ一覧を再取得します。">更新</button></div><button id="tracking" class="wide" disabled title="選択したカメラで顔・手・体の認識を開始します。">カメラを開始</button><p id="camera-note" aria-live="polite"></p><p id="camera-permission" aria-live="polite"></p></div>
   <div class="preview-actions">
    <button id="open" disabled title="PCに保存したVRMファイルを開きます。">VRMを開く</button>
    <button id="calibrate" title="今の顔の向きを正面として合わせます。&#10;Macの共通ショートカット：⌘⇧C&#10;アプリが前面なら右Control／右Shift単独でも実行します。">キャリブレーション</button>
    <button id="reset" title="拡大率・移動位置・カメラの回転を最初の状態に戻します。">初期位置に戻す</button>
    <button id="pan-mode" aria-pressed="false" title="オンの間、プレビュー上の2本指スクロールで上下左右へ移動します。ピンチで拡大・縮小できます。">移動</button>
    <button id="maximize" title="プレビューを最大化します。&#10;Escで元に戻します。ダブルクリックでも切り替えられます。">最大化</button>
    <button id="privacy" aria-pressed="false" title="アバターを隠します。&#10;オンの間は透過だけを出力します。">待機画面</button>
   </div>
   <div id="preset-bar"></div>
   <div class="status-line"><span id="model">サンプルを準備中</span><span id="status">描画エンジンの準備中…</span><span id="output-status">Syphon：停止中</span><span id="memory">メモリ：計測中</span></div>
   <div class="status-line"><span id="input">カメラ入力：720p / 最大30fps</span><span id="recognition-summary">認識：確認中</span></div>
  </div>
 </section>
 <aside>
  <div class="settings">
   <button id="settings-card" type="button" title="動きの調整を1枚の画像にして保存します。&#10;画像はクリップボードにもコピーされます。&#10;VRMやカメラの名前は入りません。">設定を画像で保存</button>
   <h2 class="section-title">目線</h2>
   <label title="目線対応のVRMで使えます。自分の目に追従する場合は、カメラを見てキャリブレーションしてください。">目線モード<select id="gazeMode"><option value="tracking">自分の目に追従</option><option value="camera">常にカメラ目線</option><option value="fixed">正面固定</option></select></label>
   <label title="追従感度は「自分の目に追従」のときに使います。">目線の追従感度：<output id="gazeStrength-value"></output><input id="gazeStrength" type="range" min="0" max="3" step="0.1" value="1"></label>
   <label title="可動範囲はカメラ目線でも使えます。&#10;1倍でモデル標準、5倍まで拡大できます（目ボーンは最大45度、表情式は表情の最大量まで）。VRMファイルは変更しません。">目の可動範囲：<output id="gazeRange-value"></output><input id="gazeRange" type="range" min="1" max="5" step="0.1" value="1"></label>
   <h2 class="section-title">顔・口</h2>
   <label title="大きく：滑らかになる／反応はゆっくり&#10;小さく：素早く反応する／細かな揺れが出やすい">滑らかさ：<output id="smoothing-value"></output><input id="smoothing" type="range" min="0" max="0.95" step="0.05" value="0.65"></label>
   <label title="頭の向き・傾きを反映する強さです。&#10;1倍：今までと同じ／4倍：顔45度でアバターの顔180度。回転は180度まで。体の強さとは別に調整できます。">顔の動きの強さ：<output id="sensitivity-value">1.0倍</output><input id="sensitivity" type="range" min="0.3" max="5" step="0.1" value="1"></label>
   <label title="口の変形量を調整します。&#10;大きく：口が大きく開く／小さく：控えめに開く">口の開き具合：<output id="mouthOpenStrength-value"></output><input id="mouthOpenStrength" type="range" min="0.5" max="3" step="0.1" value="1"></label>
   <label title="小さな口の開きを読み取る敏感さです。&#10;大きく：小さな開きにも反応／小さく：大きな開きに反応">口の感度：<output id="mouthSensitivity-value"></output><input id="mouthSensitivity" type="range" min="0.5" max="3" step="0.1" value="1.8"></label>
   <h2 class="section-title">揺れ</h2>
   <label title="髪・服などの揺れやすさです。&#10;1.0倍：モデル標準&#10;大きく：揺れやすい／小さく：揺れが控えめ">揺れものの強さ：<output id="springStrength-value"></output><input id="springStrength" type="range" min="0.3" max="5" step="0.1" value="1"></label>
   <label id="chest-spring-control" title="胸の揺れ設定を確認中です。&#10;胸専用の揺れ設定があるモデルで使えます。1倍：現在の揺れ。大きくすると胸だけ揺れが残りやすくなります。全体の揺れものの強さと組み合わせて使います。">胸の揺れやすさ：<output id="chestSpringStrength-value"></output><input id="chestSpringStrength" type="range" min="0.3" max="20" step="0.1" value="1" disabled></label>
   <h2 class="section-title">体</h2>
   <label title="頭に連動する体の左右のひねりを調整します。&#10;1倍：今までと同じ／20倍：顔30度で体180度（左右180度まで）。0倍：左右のひねりなし。頭の向き・前後の傾きは変わりません。">体の動きの強さ：<output id="bodyStrength-value">1.0倍</output><input id="bodyStrength" type="range" min="0" max="20" step="0.1" value="1"></label>
   <label title="カメラとの距離による体の傾きを調整します。1倍：今までと同じ／0倍：この方向の傾きなし。">前傾の強さ：<output id="forwardLeanStrength-value">1.0倍</output><input id="forwardLeanStrength" type="range" min="0" max="3" step="0.1" value="1"></label>
   <label title="カメラとの距離による体の傾きを調整します。1倍：今までと同じ／0倍：この方向の傾きなし。">反りの強さ：<output id="backwardLeanStrength-value">1.0倍</output><input id="backwardLeanStrength" type="range" min="0" max="3" step="0.1" value="1"></label>
   <label title="体を左右に倒したときの傾きを調整します。&#10;1倍：肩の傾きと同じ／0：オフ。&#10;まっすぐ座った状態でキャリブレーションしてください。">左右の傾き：<output id="sideTiltStrength-value">1.0倍</output><input id="sideTiltStrength" type="range" min="0" max="5" step="0.1" value="1"></label>
   <h2 class="section-title">手</h2>
   <label class="hand-option" title="オフにすると手の認識を止めて、腕を下ろした姿勢にします。手を動かさないときは、認識の負荷も減ります。"><input id="handTracking" type="checkbox" checked> 手をトラッキングする</label>
   <h2 class="section-title">ズーム</h2>
   <label title="カメラに近づいたときに大きくする強さです。0：オフ／大きいほど少ない移動で変化。普段の距離でキャリブレーションしてください。">近距離による拡大：<output id="nearZoomStrength-value">オフ</output><input id="nearZoomStrength" type="range" min="0" max="20" step="0.1" value="0"></label>
   <label title="カメラから離れたときに小さくする強さです。0：縮小なし／大きいほど少ない移動で変化。普段の距離でキャリブレーションしてください。">遠距離による縮小：<output id="farZoomStrength-value">オフ</output><input id="farZoomStrength" type="range" min="0" max="5" step="0.1" value="0"></label>
   <label title="顔の位置から拡大の中心をずらします。マイナス：左／プラス：右／0：顔の位置。100はプレビューの幅の半分です。矢印キーで細かく調整できます。">拡大の中心（左右）：<output id="zoomCenterX-value">顔の位置</output><input id="zoomCenterX" type="range" min="-100" max="100" step="0.1" value="0"></label>
   <label title="顔の位置から拡大の中心をずらします。マイナス：下／プラス：上／0：顔の位置。100はプレビューの高さの半分です。矢印キーで細かく調整できます。">拡大の中心（上下）：<output id="zoomCenterY-value">顔の位置</output><input id="zoomCenterY" type="range" min="-100" max="100" step="0.1" value="0"></label>
   <h2 class="section-title">アバター</h2>
   <details id="samples"><summary title="同梱のアバターに切り替えます。青色が現在の選択です。">サンプル</summary><div class="three-buttons"><button data-sample="Y" aria-pressed="false" title="女の子のサンプル（Y）に切り替えます。">女の子</button><button data-sample="Z" aria-pressed="false" title="男の子のサンプル（Z）に切り替えます。">男の子</button><button id="demo" data-sample="robot" aria-pressed="false" title="内蔵ロボットに切り替えます。">ロボット</button></div></details>
   <h2 class="section-title">詳細</h2>
   <label for="recognition-device">認識に使うデバイス</label>
   <select id="recognition-device"><option value="CPU">CPU</option></select>
   <button id="save-recognition" class="wide">認識デバイスを保存</button>
   <p>変更はアプリの再起動後に反映します。</p>
   <p id="recognition-status" aria-live="polite"></p>
  </div>
 </aside>
</main>
<dialog id="vrm-dialog" aria-labelledby="vrm-dialog-title"><h2 id="vrm-dialog-title">VRMを選ぶ</h2><div id="vrm-cards"></div><div class="dialog-actions"><button id="vrm-file" type="button">ファイルから開く…</button><button id="vrm-close" type="button">閉じる</button></div></dialog>
<dialog id="preset-name-dialog" aria-labelledby="preset-name-title"><form method="dialog"><h2 id="preset-name-title">プリセットを保存</h2><label for="preset-name-input">名前</label><input id="preset-name-input" type="text" maxlength="20"><p id="preset-name-problem" aria-live="polite"></p><div class="dialog-actions"><button id="preset-name-save" value="save">保存</button><button id="preset-name-cancel" value="cancel">キャンセル</button></div></form></dialog>
<dialog id="preset-export-dialog" aria-labelledby="preset-export-title"><form method="dialog"><h2 id="preset-export-title">エクスポートするプリセット</h2><div id="preset-export-list" class="preset-actions"></div><div class="preset-actions"><button id="preset-export-close" value="">閉じる</button></div></form></dialog>
<dialog id="preset-actions-dialog" aria-labelledby="preset-actions-title"><form method="dialog"><h2 id="preset-actions-title"></h2><div class="preset-actions"><button id="preset-action-overwrite" value="overwrite">今の設定で上書き</button><button id="preset-action-rename" value="rename">名前を変更…</button><button id="preset-action-delete" value="delete">削除</button><button id="preset-action-close" value="">閉じる</button></div></form></dialog>
<script src="camera-picker.js"></script><script src="slider-controls.js"></script><script src="preset-logic.js"></script><script src="app.js"></script><script src="vrm-dialog.js"></script><script src="presets.js"></script><script src="settings-card.js"></script></body></html>
